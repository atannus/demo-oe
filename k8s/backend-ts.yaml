apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-ts-config
  namespace: edu-oe
data:
  MONGODB_URI: "mongodb://mongo-0.mongo.edu-oe.svc.cluster.local:27017/app?replicaSet=rs0"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ts
  namespace: edu-oe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-ts
  template:
    metadata:
      labels:
        app: backend-ts
    spec:
      containers:
        - name: backend-ts
          image: edu-oe/backend-ts:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: backend-ts-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ts
  namespace: edu-oe
  labels:
    app: backend-ts
spec:
  type: LoadBalancer
  selector:
    app: backend-ts
  ports:
    - name: http
      port: 3001
      targetPort: 3001
