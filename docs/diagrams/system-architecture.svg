<svg viewBox="0 0 960 490" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="System architecture: Frontend, FastAPI, NestJS, PostgreSQL, Redis, MongoDB, relay nodes">
  <title>System Architecture</title>

  <style>
    /* ── Palette ─────────────────────────────────────────────────────── */
    .bg   { fill: #2e2e2e }
    .node { fill: #343434 }
    .dim  { fill: #747474 }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #f0f0f0 }
      .node { fill: #f8f8f8 }
      .dim  { fill: #888888 }
    }

    /* ── Node borders by technology ──────────────────────────────────── */
    .b-fe { stroke: #6c6c6c; stroke-opacity: .55 }
    .b-ts { stroke: #3178c6; stroke-opacity: .6 }
    .b-py { stroke: #3d9bd4; stroke-opacity: .6 }
    .b-mg { stroke: #4db33d; stroke-opacity: .6 }
    .b-pg { stroke: #336791; stroke-opacity: .6 }
    .b-rd { stroke: #c82828; stroke-opacity: .6 }

    /* ── PositionBox inner widgets ───────────────────────────────────── */
    .b-pb { stroke: #7a94b8; stroke-opacity: .5; stroke-dasharray: 4 2 }
    .marker-ring { fill: none; stroke: #7a94b8; stroke-opacity: .65; stroke-width: 1.5 }
    .marker-dot  { fill: #7a94b8; fill-opacity: .75 }

    /* ── Typography ──────────────────────────────────────────────────── */
    .mono  { font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 500 }
    .small { font-family: system-ui, sans-serif; font-size: 9px }

    /* ── Brand text colours ──────────────────────────────────────────── */
    .c-fe { fill: #9c9c9c }
    .c-ts { fill: #3178c6 }
    .c-py { fill: #3d9bd4 }
    .c-mg { fill: #4db33d }
    .c-pg { fill: #336791 }
    .c-rd { fill: #c82828 }

    /* ── Edges ───────────────────────────────────────────────────────── */
    .e       { stroke: #3db845; stroke-opacity: .7; stroke-width: 1.5; fill: none }
    .e-dash  { stroke-dasharray: 5 3; stroke-opacity: .42 }
    .e-label { font-family: system-ui, sans-serif; font-size: 9px; fill: #747474; fill-opacity: .9 }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#3db845" fill-opacity=".8"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#3db845" fill-opacity=".42"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="490"/>

  <!-- ══ Frontend container ═══════════════════════════════════════════ -->
  <rect x="250" y="16" width="460" height="96" rx="6" class="node b-fe"/>
  <text x="480" y="31" text-anchor="middle" class="mono c-fe">Frontend :5173</text>
  <text x="480" y="43" text-anchor="middle" class="small dim">React / Vite</text>

  <!-- PositionBox (FastAPI side) -->
  <rect x="315" y="50" width="88" height="52" rx="4" class="node b-pb"/>
  <circle cx="359" cy="76" r="9" class="marker-ring"/>
  <circle cx="359" cy="76" r="2.5" class="marker-dot"/>

  <!-- PositionBox (NestJS side) -->
  <rect x="557" y="50" width="88" height="52" rx="4" class="node b-pb"/>
  <circle cx="601" cy="76" r="9" class="marker-ring"/>
  <circle cx="601" cy="76" r="2.5" class="marker-dot"/>

  <!-- ══ Backends ══════════════════════════════════════════════════════ -->
  <rect x="50"  y="160" width="230" height="44" rx="4" class="node b-py"/>
  <text x="165" y="177" text-anchor="middle" class="mono c-py">FastAPI :8000</text>
  <text x="165" y="190" text-anchor="middle" class="small dim">Python</text>

  <rect x="680" y="160" width="230" height="44" rx="4" class="node b-ts"/>
  <text x="795" y="177" text-anchor="middle" class="mono c-ts">NestJS :3001</text>
  <text x="795" y="190" text-anchor="middle" class="small dim">TypeScript</text>

  <!-- ══ Storage + Redis ═══════════════════════════════════════════════ -->
  <rect x="50"  y="280" width="230" height="50" rx="4" class="node b-pg"/>
  <text x="165" y="301" text-anchor="middle" class="mono c-pg">PostgreSQL</text>
  <text x="165" y="315" text-anchor="middle" class="small dim">positions · outbox</text>

  <rect x="365" y="280" width="230" height="50" rx="4" class="node b-rd"/>
  <text x="480" y="301" text-anchor="middle" class="mono c-rd">Redis</text>
  <text x="480" y="315" text-anchor="middle" class="small dim">pub/sub · position:replicated</text>

  <rect x="680" y="280" width="230" height="50" rx="4" class="node b-mg"/>
  <text x="795" y="301" text-anchor="middle" class="mono c-mg">MongoDB</text>
  <text x="795" y="315" text-anchor="middle" class="small dim">positions · outbox</text>

  <!-- ══ Relay nodes ═══════════════════════════════════════════════════ -->
  <rect x="50"  y="400" width="230" height="62" rx="4" class="node b-py"/>
  <text x="165" y="421" text-anchor="middle" class="mono c-py">Outbox Relay</text>
  <text x="165" y="435" text-anchor="middle" class="small dim">polling 100ms · pull-based</text>
  <text x="165" y="449" text-anchor="middle" class="small dim">at-least-once delivery</text>

  <rect x="680" y="400" width="230" height="62" rx="4" class="node b-ts"/>
  <text x="795" y="421" text-anchor="middle" class="mono c-ts">CDC Relay</text>
  <text x="795" y="435" text-anchor="middle" class="small dim">change stream · push-based</text>
  <text x="795" y="449" text-anchor="middle" class="small dim">at-least-once delivery</text>

  <!-- ══ Edges ═════════════════════════════════════════════════════════ -->

  <!-- REST PATCH: PositionBox (py-side) → FastAPI -->
  <line x1="350" y1="112" x2="142" y2="160" class="e" marker-end="url(#ah)"/>
  <text x="222" y="129" text-anchor="middle" class="e-label">REST PATCH</text>

  <!-- WebSocket: FastAPI → PositionBox (py-side) -->
  <line x1="188" y1="160" x2="368" y2="112" class="e e-dash" marker-end="url(#ah-d)"/>
  <text x="302" y="148" text-anchor="middle" class="e-label">WebSocket</text>

  <!-- REST PATCH: PositionBox (ts-side) → NestJS -->
  <line x1="610" y1="112" x2="818" y2="160" class="e" marker-end="url(#ah)"/>
  <text x="738" y="129" text-anchor="middle" class="e-label">REST PATCH</text>

  <!-- WebSocket: NestJS → PositionBox (ts-side) -->
  <line x1="772" y1="160" x2="592" y2="112" class="e e-dash" marker-end="url(#ah-d)"/>
  <text x="658" y="148" text-anchor="middle" class="e-label">WebSocket</text>

  <!-- atomic tx: FastAPI → PostgreSQL -->
  <line x1="165" y1="204" x2="165" y2="280" class="e" marker-end="url(#ah)"/>
  <text x="153" y="246" text-anchor="end" class="e-label">atomic tx</text>

  <!-- atomic tx: NestJS → MongoDB -->
  <line x1="795" y1="204" x2="795" y2="280" class="e" marker-end="url(#ah)"/>
  <text x="807" y="246" text-anchor="start" class="e-label">atomic tx</text>

  <!-- pull: PostgreSQL → Outbox Relay -->
  <line x1="165" y1="330" x2="165" y2="400" class="e" marker-end="url(#ah)"/>
  <text x="153" y="368" text-anchor="end" class="e-label">pull</text>

  <!-- push: MongoDB → CDC Relay -->
  <line x1="795" y1="330" x2="795" y2="400" class="e" marker-end="url(#ah)"/>
  <text x="807" y="368" text-anchor="start" class="e-label">push</text>

  <!-- pub: Outbox Relay → Redis -->
  <line x1="280" y1="431" x2="365" y2="305" class="e" marker-end="url(#ah)"/>
  <text x="314" y="362" text-anchor="middle" class="e-label">pub</text>

  <!-- pub: CDC Relay → Redis -->
  <line x1="680" y1="431" x2="595" y2="305" class="e" marker-end="url(#ah)"/>
  <text x="646" y="362" text-anchor="middle" class="e-label">pub</text>

  <!-- sub: Redis → FastAPI -->
  <line x1="400" y1="280" x2="280" y2="182" class="e" marker-end="url(#ah)"/>
  <text x="326" y="225" text-anchor="middle" class="e-label">sub</text>

  <!-- sub: Redis → NestJS -->
  <line x1="560" y1="280" x2="680" y2="182" class="e" marker-end="url(#ah)"/>
  <text x="634" y="225" text-anchor="middle" class="e-label">sub</text>

</svg>
