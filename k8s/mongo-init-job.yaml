apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: edu-oe
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7
          command:
            - /bin/sh
            - -c
            - |
              until mongosh --host mongo --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; do
                echo "Waiting for MongoDB..."; sleep 3
              done
              mongosh --host mongo --quiet --eval \
                "try { rs.status() } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo-0.mongo.edu-oe.svc.cluster.local:27017' }] }) }"
