    .b-pg { stroke: #336791; stroke-opacity: .6 }
    .b-rd { stroke: #c82828; stroke-opacity: .6 }

    /* ── Screen widgets ──────────────────────────────────────────────── */
    .b-screen    { stroke: #7a94b8; stroke-opacity: .72; stroke-width: 1.5 }
    .grid-line   { stroke: #7a94b8; stroke-opacity: .4; stroke-dasharray: 3 3; stroke-width: 1; fill: none }
    .marker-ring { fill: none; stroke: #7a94b8; stroke-opacity: .65; stroke-width: 1.5 }
    .marker-dot  { fill: #7a94b8; fill-opacity: .75 }

    /* ── Typography ──────────────────────────────────────────────────── */
    .mono  { font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 500 }
    .small { font-family: system-ui, sans-serif; font-size: 9px }

    /* ── Brand text colours ──────────────────────────────────────────── */
    .c-fe { fill: #9c9c9c }
    .c-ts { fill: #3178c6 }
    .c-py { fill: #3d9bd4 }
    .c-mg { fill: #4db33d }
    .c-pg { fill: #336791 }
    .c-rd { fill: #c82828 }

    /* ── Edges ───────────────────────────────────────────────────────── */
    .e       { stroke: #3db845; stroke-opacity: .7; stroke-width: 1.5; fill: none }
    .e-dash  { stroke-dasharray: 5 3; stroke-opacity: .42 }
    .e-label { font-family: system-ui, sans-serif; font-size: 9px; fill: #747474; fill-opacity: .9 }
